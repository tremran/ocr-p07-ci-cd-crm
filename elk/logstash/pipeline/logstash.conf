input {
  beats {
    port => 5044
  }
}

filter {
  mutate {
    add_field => { "environment" => "local" }
  }

  if [app] == "microcrm-front" {
    json {
      source => "message"
      target => "front"
      skip_on_invalid_json => true
    }

    if [front][level] {
      mutate {
        add_field => { "log_level" => "%{[front][level]}" }
      }
    }
  }

  if [app] == "microcrm-back" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:log_timestamp} %{LOGLEVEL:log_level} %{NUMBER:pid} --- \[%{DATA:thread}\] %{DATA:logger} : %{GREEDYDATA:log_message}"
      }
      tag_on_failure => ["_back_log_parse_failure"]
    }

    date {
      match => ["log_timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "microcrm-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
