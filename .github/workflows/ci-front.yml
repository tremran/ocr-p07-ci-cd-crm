name: CI front
# TODO: activer le cache

# security : par défaut droit de lecture uniquement ( moindre privilège )
permissions:
  contents: read
on: 
  workflow_call:
  push:
    branches: [ci-tests, main]
    paths:
      - 'front/**'
      - '.github/**'

env:
  NODE_VERSION: '24' # LTS

# validation
jobs:
  ## tests front
  front-tests:
    runs-on: ubuntu-26.04
    # security : utiliser le hash à la place d'un tag mutable
    steps:
      - name: installation node ${{env.NODE_VERSION}}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{env.NODE_VERSION}}
          cache: 'npm' # cache entre chaque run 
          # c'est un sous dossier il faut lui préciser le fichier à vérifier pour les caches hit
          cache-dependency-path: front/package-lock.json

      - name: installation chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2

      - name: checkout pour tests front
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1

      - name: front - tests auto + code coverage
        # commandes en une ligne pour gestion du cache
        run: cd front && npm ci && npx ng test --code-coverage --watch=false --browsers=ChromeHeadless

      - name: front - publication des rapports de couverture et de test
        if: success()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: test-results-front
          path: front/coverage/
          overwrite: true

  publish:
    runs-on: ubuntu-latest
    # needs: release
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest
            type=sha
          # type=raw,value=${{ needs.release.outputs.new_version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          target: front
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

