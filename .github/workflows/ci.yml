name: CI 
# TODO: activer le cache

# TODO : reprendre l'ordre Build > Test > Quality > Package

# security : par défaut droit de lecture uniquement ( moindre privilège )
permissions:
  contents: read
on: 
  workflow_call:
  push:
    branches: [ci-tests, main]
    paths:
      - '.github/**'

env:
  JAVA_VERSION: '17' # used in back app
  GRADLE_VERSION: '8.7' # version used in back app
  NODE_VERSION: '24' # LTS

jobs:
  # tests back
  tests-back:
    name: Backend - Tests
    runs-on: ubuntu-26.04
    steps:
      - name : checkout pour tests back
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1

      - name: install java ${{env.JAVA_VERSION}}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{env.JAVA_VERSION}}
          cache: gradle

      - name: configuration gradle ${{env.GRADLE_VERSION}}
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: ${{env.GRADLE_VERSION}}

      - name: back - tests auto 
        run: cd back && chmod +x ./gradlew && ./gradlew clean test

      - name: back - publication des rapports de couverture et de test
        if: success()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: test-results-back
          path: back/build/reports/
          overwrite: true

  # tests front
  tests-front:
    name: Frontend - Tests
    runs-on: ubuntu-26.04
    # security : utiliser le hash à la place d'un tag mutable
    steps:
      - name: installation node ${{env.NODE_VERSION}}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{env.NODE_VERSION}}
          # cache: 'npm' # cache entre chaque run 
          # c'est un sous dossier il faut lui préciser le fichier à vérifier pour les caches hit
          # cache-dependency-path: front/package-lock.json

      - name: installation chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2

      - name: checkout pour tests front
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1

      - name: front - tests auto + code coverage
        # commandes en une ligne pour gestion du cache
        run: cd front && npm ci && npx ng test --code-coverage --watch=false --browsers=ChromeHeadless

      - name: front - publication des rapports de couverture et de test
        if: success()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: test-results-front
          path: front/coverage/
          overwrite: true

  # récupération de la version
  release:
    runs-on: ubuntu-latest
    needs: [tests-front, tests-back]
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write  # Nécessaire pour créer une release et un tag
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic_release.outputs.new_release_published }}
      new_version: ${{ steps.semantic_release.outputs.new_release_version }}
    steps:
      - name: semver checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1
        with:
          fetch-depth: 0

      - name: installation node ${{env.NODE_VERSION}}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{env.NODE_VERSION}}

      - name: Semantic Release
        id: semantic_release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build de l'image complète si tests ok + push avec un tag
  publish:
    runs-on: ubuntu-latest
    needs: [release]
    if: ${{ needs.release.outputs.new_release_published == 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest
            type=sha
            type=raw,value=${{ needs.release.outputs.new_version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          target: standalone
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
