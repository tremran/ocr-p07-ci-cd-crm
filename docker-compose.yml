services:
  back:
    build:
      context: .
      dockerfile: Dockerfile
      target: back
    ports:
      - "8080:8080"
    volumes:
      - ./logs/back:/app/logs

  front:
    build:
      context: .
      dockerfile: Dockerfile
      target: front
    depends_on:
      - back
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./logs/front:/var/log/caddy
